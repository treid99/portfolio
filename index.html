<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/portfolio/favicon.svg" />

    <title>Thomas Reid — Portfolio</title>
    <meta
      name="description"
      content="Thomas Reid is a Test Engineer in New Jersey, building Playwright automation and AI-assisted QA workflows for education technology at scale."
    />
    <meta name="author" content="Thomas Reid" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Thomas Reid — Portfolio" />
    <meta
      property="og:description"
      content="Playwright automation, AI-assisted QA workflows, and test strategy for platforms serving millions of daily data points."
    />
    <meta property="og:url" content="https://treid99.github.io/portfolio/" />
    <meta property="og:image" content="https://treid99.github.io/portfolio/assets/portrait.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applied before first paint so a reload never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('tr-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
